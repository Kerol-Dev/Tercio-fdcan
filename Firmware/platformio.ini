; Tercio FD — USB to CAN-FD adapter firmware.
;
; Builds against the STM32duino core and ST's HAL only (no third-party
; libraries). Platform and core are pinned to the same versions as the Tercio
; S1 firmware, so both ends of the bus are built from identical sources.
;
; First flash of a new board: set the boot option bytes once (see
; src/board/BootOptions.cpp), e.g. with STM32CubeProgrammer:
;   STM32_Programmer_CLI -c port=SWD -ob nSWBOOT0=0 nBOOT0=1
; The firmware also corrects them by itself whenever it gets to run.

[platformio]
default_envs = tercio_fd

[env:tercio_fd]
platform = platformio/ststm32@20.0.0
board = genericSTM32G431CB
framework = arduino
upload_protocol = stlink
debug_tool = stlink

build_unflags = -Os
build_flags =
	-O2
	-I src
	-D HAL_FDCAN_MODULE_ENABLED
	-D HAL_TIM_MODULE_ONLY
	-D HSE_VALUE=16000000UL
	-D USBCON
	-D USBD_USE_CDC
	-D USBD_VID=0x1209
	-D USBD_PID=0x0011
	-D USB_PRODUCT_STRING="\"tercioFD\""
	-D USB_MANUFACTURER_STRING="\"TercioLabs\""
	; The core's default CDC queues hold two USB packets (~2 frames); give the
	; bridge room for bursts of telemetry from many nodes.
	-D CDC_TRANSMIT_QUEUE_BUFFER_PACKET_NUMBER=32
	-D CDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=16
	; With a 2 KB queue one USB transfer can take ~3 ms; the core's default 3 ms
	; timeout would then report the host as gone and drop frames.
	-D USB_CDC_TRANSMIT_TIMEOUT=100
	-Wall
	-Wextra
	-Wdouble-promotion
	-Wno-unused-parameter

; Host-side unit tests for the framing and adapter protocol.
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -I src -Wall -Wextra
build_src_filter = -<*>
test_build_src = yes
