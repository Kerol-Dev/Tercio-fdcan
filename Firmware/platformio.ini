[env:genericSTM32G431CB]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags = 
	-DHAL_FDCAN_MODULE_ENABLED
	-DUSBCON
	-DUSBD_USE_CDC
	-D USBD_VID=0x1209
    -D USBD_PID=0x0011
    -D USBD_PRODUCT_STRING="tercioFD"
    -D USBD_MANUFACTURER_STRING="TercioLabs"
lib_deps = pierremolinaro/ACANFD_STM32@^1.1.2-rc1
